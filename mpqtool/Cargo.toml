[package]
name = "mpqtool"
description = "Inspect, extract and repair MPQ archives (CLI + GUI)"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mpq = { path = "../mpq" }
clap.workspace = true
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
rfd = "0.17"

[[bin]]
name = "mpqtool"
path = "src/main.rs"
