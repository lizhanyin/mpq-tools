[workspace]
resolver = "3"
members = ["mpq", "mpqtool", "gui"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
flate2 = "1.1"
bzip2-rs = "0.1"
lzma-rs = "0.3"
md-5 = "0.10"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
